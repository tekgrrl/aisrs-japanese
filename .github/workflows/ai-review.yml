name: AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Guard against a self-triggering loop: posting a review with inline comments
    # itself fires pull_request_review_comment events. Only re-run on a reply from
    # someone other than this same reviewer identity (a human, or Claude replying
    # via the claude-reviewer-aigenki App) on a PR that's still open — pull_request
    # events (opened/synchronize) always run.
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.comment.user.login != 'github-actions[bot]' &&
       github.event.pull_request.state == 'open')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests google-genai anthropic

      - name: Run AI Review Script
        env:
          # Change to 'anthropic' when ready to test Sonnet/Opus 4.6
          MODEL_PROVIDER: 'gemini'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Deliberately the default Actions token (github-actions[bot]), NOT a
          # custom App token — PRs in this repo are authored by the
          # claude-reviewer-aigenki App identity, and GitHub blocks an actor
          # from submitting a review on its own PR (this was the actual cause
          # of every review failing with 422, not model quality).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python .github/scripts/review.py